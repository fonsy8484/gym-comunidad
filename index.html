<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Comunidad</title>
<style>
:root{--bg:#080c12;--card:#111925;--card2:#0d141e;--line:#203047;--text:#f1f6ff;--muted:#9ca9ba;--blue:#3985ff;--green:#21c87a;--red:#fa5555;--orange:#f5aa3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:rgba(8,12,18,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:24px;margin:0}.week{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}.icon{background:#111b2a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.wrap{max-width:760px;margin:auto;padding:16px}.view{display:none}.view.active{display:block}.card,.exercise{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}.hero h2{font-size:27px;margin:0 0 7px}.muted{color:var(--muted)}.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:17px 0}.day{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:#090e15}.day.today{outline:3px solid var(--blue);color:#dce9ff}.day.done{background:var(--green);color:white;border-color:var(--green);font-weight:700}.bar{height:10px;border-radius:99px;background:#070b10;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:.25s}.exercise{padding:14px}.exhead{display:flex;gap:13px;align-items:center}.bodymap{width:92px;height:108px;flex:none;background:#081018;border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;overflow:hidden}.bodymap svg{height:104px;width:82px}.exhead h3{font-size:20px;margin:0 0 4px;line-height:1.12}.exhead p{margin:0;color:var(--muted);font-size:13px}.video{color:var(--blue)}.sets{display:grid;gap:8px;margin-top:14px}.set{display:grid;grid-template-columns:34px 1fr 1fr 62px 42px;gap:7px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:7px}.num{text-align:center;color:var(--muted)}input,textarea{min-width:0;background:#080d14;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font-size:16px}input::placeholder,textarea::placeholder{color:#758195}.rir{font-size:13px}.check{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#080d14;color:#fff;font-size:20px}.check.done{background:var(--green);border-color:var(--green)}.add{width:100%;margin-top:9px;border:1px dashed #3560a0;background:#102039;color:#bcd4ff;padding:10px;border-radius:11px}.rest{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rest b{font-size:13px;color:var(--muted);margin-right:auto}.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--blue);color:#fff}.btn.alt{background:#162337;border:1px solid var(--line)}.time{font-variant-numeric:tabular-nums;min-width:48px}.details{margin-top:10px}.details summary{color:var(--muted);font-size:13px}.details p{color:var(--muted);font-size:13px;line-height:1.4}.note{width:100%;margin-top:10px;resize:vertical}.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}.plan{padding:15px;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:16px}.plan.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.plan small{display:block;color:var(--muted);margin-top:4px}.dayslist{display:grid;gap:8px;margin-top:14px}.daybutton{padding:13px;border-radius:13px;background:var(--card);border:1px solid var(--line);color:var(--text);text-align:left}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:var(--card2);padding:14px;border-radius:14px;text-align:center;border:1px solid var(--line)}.metric strong{display:block;font-size:23px}.metric span{font-size:12px;color:var(--muted)}.muscles{margin-top:13px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.muscle{background:var(--card2);border:1px solid var(--line);padding:10px;border-radius:11px;font-size:13px;display:flex;justify-content:space-between}.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(8,12,18,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nav{background:transparent;border:0;color:var(--muted);padding:11px 4px;border-radius:12px;font-size:15px}.nav.active{color:var(--text);background:#152238}.hint{font-size:12px;color:var(--muted);margin:8px 2px 0}.danger{background:#3a171c;color:#ffc6ca}.empty{padding:25px 12px;text-align:center;color:var(--muted)}@media(max-width:420px){.top h1{font-size:21px}.week{font-size:12px}.hero h2{font-size:25px}.set{grid-template-columns:27px 1fr 1fr 49px 38px;gap:5px}.set input{padding:9px 6px}.bodymap{width:80px;height:96px}.bodymap svg{height:92px;width:73px}.exhead h3{font-size:18px}}
</style>
</head>
<body>
<header class="top"><h1 id="title">Hoy</h1><div class="week"><button class="icon" id="prev">◀</button><span id="weekLabel"></span><button class="icon" id="next">▶</button></div></header>
<main class="wrap">
<section id="today" class="view active"><div class="card hero"><h2 id="todayName"></h2><p class="muted" id="todayFocus"></p><div id="weekGrid" class="weekgrid"></div><div class="bar"><i id="progress"></i></div><p class="muted" id="progressText" style="margin:10px 0 0"></p></div><div id="exerciseList"></div></section>
<section id="routine" class="view"><div class="card"><h2 style="margin:0 0 12px">Rutina</h2><div class="plans"><button class="plan" data-plan="PPL"><b>PPL</b><small>Push · Pull · Legs</small></button><button class="plan" data-plan="UL"><b>Upper / Lower</b><small>Torso · Pierna</small></button></div><div id="dayList" class="dayslist"></div></div></section>
<section id="stats" class="view"><div class="card"><h2 style="margin:0 0 13px">Resumen semanal</h2><div class="metrics"><div class="metric"><strong id="mDays">0/6</strong><span>Días completados</span></div><div class="metric"><strong id="mSets">0</strong><span>Series completadas</span></div><div class="metric"><strong id="mVolume">0 kg</strong><span>Volumen total</span></div><div class="metric"><strong id="mExercises">0</strong><span>Ejercicios usados</span></div></div><h3>Series por músculo</h3><div class="muscles" id="muscleStats"></div></div><div class="card"><h3 style="margin-top:0">Copia de seguridad</h3><p class="muted">Tus datos se guardan en este dispositivo y navegador.</p><button class="btn" id="export">Exportar datos</button> <button class="btn alt" id="import">Importar</button><input id="importFile" type="file" accept="application/json" hidden><button class="btn danger" id="reset" style="margin-top:10px">Reiniciar esta semana</button></div></section>
</main>
<nav class="bottom"><button class="nav active" data-view="today">Hoy</button><button class="nav" data-view="routine">Rutina</button><button class="nav" data-view="stats">Progreso</button></nav>
<script>
const D=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const E=(name,muscle,alt)=>({name,muscle,alt,sets:3});
const R={
PPL:[
['Push A','Pecho, hombro y tríceps',[E('Press de banca con barra','pecho','Press plano con mancuernas'),E('Press inclinado con mancuernas','pecho','Press inclinado con barra'),E('Aperturas en polea','pecho','Aperturas con mancuernas'),E('Press militar','hombro','Press militar con mancuernas'),E('Elevaciones laterales','hombro','Elevaciones laterales en polea'),E('Extensión de tríceps en polea','triceps','Fondos entre bancos')]],
['Pull A','Espalda, bíceps y antebrazo',[E('Jalones al pecho (agarre medio)','espalda','Jalón con agarre neutro'),E('Remo con barra','espalda','Remo con mancuerna a una mano'),E('Remo en polea baja','espalda','Remo con barra'),E('Face pull','hombro','Pájaros con mancuernas'),E('Curl de bíceps con barra','biceps','Curl con mancuernas'),E('Curl martillo','antebrazo','Curl de bíceps con mancuerna'),E('Curl de muñeca (flexores)','antebrazo','Curl de muñeca con mancuerna'),E('Curl inverso de muñeca (extensores)','antebrazo','Curl inverso con barra')]],
['Legs A','Cuádriceps, femoral y gemelo',[E('Sentadilla con barra','pierna','Sentadilla goblet'),E('Zancadas con mancuernas','pierna','Sentadilla búlgara'),E('Peso muerto rumano','pierna','Peso muerto rumano con mancuernas'),E('Curl femoral','pierna','Buenos días con barra'),E('Elevación de gemelos de pie','pierna','Elevación a una pierna'),E('Plancha abdominal','core','Crunch')]],
['Push B','Hombro, pecho y tríceps',[E('Press militar con barra','hombro','Press con mancuernas'),E('Press plano con mancuernas','pecho','Press de banca con barra'),E('Fondos o press cerrado','triceps','Extensión en polea'),E('Elevaciones laterales','hombro','Elevación lateral en polea'),E('Face pull ligero','hombro','Pájaros'),E('Extensión tras nuca','triceps','Extensión en polea'),E('Curl de muñeca (extensores)','antebrazo','Curl inverso con barra')]],
['Pull B','Espalda, bíceps y antebrazo',[E('Jalón al pecho supino','espalda','Jalón agarre neutro'),E('Remo con mancuerna','espalda','Remo con barra'),E('Remo en polea','espalda','Remo invertido'),E('Encogimientos','espalda','Remo al cuello ligero'),E('Curl concentrado','biceps','Curl predicador'),E('Curl martillo','antebrazo','Curl con cuerda'),E('Curl de muñeca (flexores)','antebrazo','Curl con barra')]],
['Legs B','Glúteo, femoral, gemelo y abdomen',[E('Hip thrust','pierna','Puente de glúteo'),E('Sentadilla búlgara','pierna','Zancadas'),E('Peso muerto rumano','pierna','Buenos días'),E('Curl femoral','pierna','Nordic asistido'),E('Gemelo sentado','pierna','Gemelo de pie'),E('Elevación de piernas','core','Plancha')]]],
UL:[]};
R.UL=[R.PPL[0].map?null:null];
R.UL=[
['Upper A','Pecho, espalda, hombro y brazos',[E('Press de banca con barra','pecho','Press con mancuernas'),E('Remo con barra','espalda','Remo con mancuerna'),E('Press militar','hombro','Press mancuernas'),E('Jalón al pecho','espalda','Dominada asistida'),E('Curl de bíceps','biceps','Curl mancuerna'),E('Extensión de tríceps','triceps','Fondos'),E('Curl de muñeca','antebrazo','Curl con mancuerna')]],
['Lower A','Pierna completa',[E('Sentadilla con barra','pierna','Goblet squat'),E('Peso muerto rumano','pierna','Mancuernas'),E('Zancadas','pierna','Búlgara'),E('Curl femoral','pierna','Buenos días'),E('Gemelo de pie','pierna','Una pierna'),E('Plancha','core','Crunch')]],
['Upper B','Torso y antebrazo',[E('Press inclinado','pecho','Press plano'),E('Remo mancuerna','espalda','Remo polea'),E('Elevaciones laterales','hombro','Polea'),E('Face pull','hombro','Pájaros'),E('Curl martillo','antebrazo','Curl barra'),E('Extensión tras nuca','triceps','Polea'),E('Curl inverso muñeca','antebrazo','Curl inverso barra')]],
['Lower B','Glúteo y femoral',[E('Hip thrust','pierna','Puente glúteo'),E('Búlgara','pierna','Zancada'),E('Peso muerto rumano','pierna','Buenos días'),E('Curl femoral','pierna','Nordic'),E('Gemelo sentado','pierna','Gemelo pie'),E('Elevación piernas','core','Plancha')]],
['Upper C','Torso, brazos y muñeca',[E('Press mancuernas','pecho','Press barra'),E('Jalón pecho','espalda','Remo'),E('Remo polea','espalda','Remo barra'),E('Curl bíceps','biceps','Curl concentrado'),E('Tríceps polea','triceps','Fondos'),E('Curl muñeca flexores','antebrazo','Mancuerna'),E('Curl muñeca extensores','antebrazo','Barra')]],
['Lower C','Pierna y abdomen',[E('Sentadilla','pierna','Goblet'),E('Zancadas','pierna','Búlgara'),E('Peso muerto rumano','pierna','Mancuernas'),E('Curl femoral','pierna','Buenos días'),E('Gemelo','pierna','A una pierna'),E('Crunch','core','Plancha')]]
];
let plan=localStorage.gymPlan||'PPL',week=0,selectedDay=(new Date().getDay()+6)%7;
const key=()=>{let d=new Date();let n=d.getDay()||7;d.setDate(d.getDate()-n+1+week*7);return d.toISOString().slice(0,10)};
const get=()=>JSON.parse(localStorage.gymV3||'{}'); const save=x=>localStorage.gymV3=JSON.stringify(x);
function wk(){let x=get(),k=key();if(!x[k])x[k]={};return [x,x[k],k]}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function map(m){let c='#66768a',hot='#ff5b54';let parts={pecho:'M28 28h12v21H28zM42 28h12v21H42z',espalda:'M25 26h14v35H25zM43 26h14v35H43z',hombro:'M18 27h10v18H18zM54 27h10v18H54z',biceps:'M18 43h10v25H18zM54 43h10v25H54z',triceps:'M18 43h10v25H18zM54 43h10v25H54z',antebrazo:'M16 64h10v26H16zM56 64h10v26H56z',pierna:'M29 61h12v39H29zM43 61h12v39H43z',core:'M32 49h20v16H32z'};return `<svg viewBox="0 0 82 108" aria-label="Músculo trabajado: ${m}"><circle cx="41" cy="13" r="9" fill="#66768a"/><path d="M30 23 Q41 18 52 23 L58 61 L52 67 L55 103 L43 103 L41 70 L39 103 L27 103 L30 67 L24 61Z" fill="#425064"/><path d="M30 26L18 43 16 87M52 26L64 43 66 87" stroke="#425064" stroke-width="9" stroke-linecap="round" fill="none"/><path d="${parts[m]||parts.core}" fill="${hot}" opacity=".95"/><text x="41" y="106" text-anchor="middle" fill="#cbd5e1" font-size="7">${m.toUpperCase()}</text></svg>`}
function exKey(d,i){return `${plan}-${d}-${i}`}
function exData(d,i){let [x,w]=wk(),k=exKey(d,i);if(!w[k])w[k]={sets:[{},{},{}],note:''};save(x);return w[k]}
function renderToday(){let day=selectedDay===6?0:selectedDay;let r=R[plan][day];document.querySelector('#todayName').textContent=`${D[day]} — ${r[0]}`;document.querySelector('#todayFocus').textContent=`${r[1]} · ${r[2].length} ejercicios`;renderWeek();let list=document.querySelector('#exerciseList');list.innerHTML='';r[2].forEach((e,i)=>list.appendChild(card(day,i,e)));progress(day)}
function card(day,i,e){let data=exData(day,i),el=document.createElement('article');el.className='exercise';el.innerHTML=`<div class="exhead"><div class="bodymap">${map(e.muscle)}</div><div><h3>${esc(e.name)}</h3><p><a class="video" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.name+' técnica')}">Ver vídeo</a> · series</p></div></div><div class="sets"></div><button class="add">＋ Añadir serie</button><div class="rest"><b>Descanso de este ejercicio</b><button class="btn rest90">90 s</button><button class="btn alt rest120">120 s</button><span class="time">00:00</span></div><details class="details"><summary>Alternativa si está ocupado</summary><p>${esc(e.alt)}</p></details><textarea class="note" rows="2" placeholder="Notas: RIR, molestias, próxima vez...">${esc(data.note||'')}</textarea>`;let sets=el.querySelector('.sets');function row(s,n){let q=s||{};let z=document.createElement('div');z.className='set';z.innerHTML=`<span class="num">${n}</span><input inputmode="decimal" placeholder="kg" value="${q.w||''}"><input inputmode="numeric" placeholder="reps" value="${q.r||''}"><input class="rir" inputmode="numeric" placeholder="RIR" value="${q.rir||''}"><button class="check ${q.done?'done':''}">${q.done?'✓':''}</button>`;let ins=z.querySelectorAll('input');ins.forEach((a,j)=>a.oninput=()=>{let d=exData(day,i);d.sets[n-1]||(d.sets[n-1]={});d.sets[n-1][['w','r','rir'][j]]=a.value;let [x,w]=wk();w[exKey(day,i)]=d;save(x);progress(day)});z.querySelector('.check').onclick=()=>{let d=exData(day,i);d.sets[n-1].done=!d.sets[n-1].done;let [x,w]=wk();w[exKey(day,i)]=d;save(x);renderToday()};sets.appendChild(z)}data.sets.forEach(row);el.querySelector('.add').onclick=()=>{let d=exData(day,i);d.sets.push({});let [x,w]=wk();w[exKey(day,i)]=d;save(x);renderToday()};el.querySelector('.note').oninput=a=>{let d=exData(day,i);d.note=a.target.value;let [x,w]=wk();w[exKey(day,i)]=d;save(x)};let timer;function start(n){clearInterval(timer);let t=n,out=el.querySelector('.time');let paint=()=>out.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;paint();timer=setInterval(()=>{if(--t<0){clearInterval(timer);out.textContent='✓ Listo';navigator.vibrate&&navigator.vibrate([150,100,150])}else paint()},1000)}el.querySelector('.rest90').onclick=()=>start(90);el.querySelector('.rest120').onclick=()=>start(120);return el}
function progress(day){let[,w]=wk(),total=0,done=0;R[plan][day][2].forEach((e,i)=>{let q=w[exKey(day,i)];(q?.sets||[]).forEach(s=>{total++;if(s.done)done++})});document.querySelector('#progress').style.width=(total?done/total*100:0)+'%';document.querySelector('#progressText').textContent=`${done} / ${total} series completadas`;renderWeek()}
function renderWeek(){let[,w]=wk(),g=document.querySelector('#weekGrid');g.innerHTML='';for(let d=0;d<7;d++){let done=false;Object.entries(w).forEach(([k,q])=>{if(k.startsWith(plan+'-'+d+'-')&&q.sets?.some(s=>s.done))done=true});let x=document.createElement('div');x.className='day '+(d===selectedDay?'today ':'')+(done?'done':'');x.textContent=done?'✓':D[d].slice(0,3);g.appendChild(x)}document.querySelector('#weekLabel').textContent='Semana '+key()}
function routine(){document.querySelectorAll('.plan').forEach(x=>x.classList.toggle('selected',x.dataset.plan===plan));let a=document.querySelector('#dayList');a.innerHTML='';R[plan].forEach((r,i)=>{let b=document.createElement('button');b.className='daybutton';b.innerHTML=`<b>${D[i]} — ${r[0]}</b><br><small class="muted">${r[1]}</small>`;b.onclick=()=>{selectedDay=i;show('today')};a.appendChild(b)})}
function stats(){let[,w]=wk(),sets=0,vol=0,ex=0,m={};Object.entries(w).forEach(([k,q])=>{let p=k.split('-'),d=+p[1],i=+p[2],e=R[p[0]][d]?.[2][i];let used=false;(q.sets||[]).forEach(s=>{if(s.done){sets++;used=true;vol+=(+s.w||0)*(+s.r||0);m[e?.muscle||'Otros']=(m[e?.muscle||'Otros']||0)+1}});if(used)ex++});let days=new Set(Object.keys(w).filter(k=>w[k].sets?.some(s=>s.done)).map(k=>k.split('-')[1])).size;document.querySelector('#mDays').textContent=days+'/6';document.querySelector('#mSets').textContent=sets;document.querySelector('#mVolume').textContent=Math.round(vol)+' kg';document.querySelector('#mExercises').textContent=ex;let q=document.querySelector('#muscleStats');q.innerHTML=Object.entries(m).map(([a,b])=>`<div class="muscle"><span>${a}</span><b>${b}</b></div>`).join('')||'<p class="empty">Completa series para ver tus datos.</p>'}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.querySelector('#title').textContent=v==='today'?'Hoy':v==='routine'?'Rutina':'Progreso';if(v==='today')renderToday();if(v==='routine')routine();if(v==='stats')stats()}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>show(x.dataset.view));document.querySelectorAll('.plan').forEach(x=>x.onclick=()=>{plan=x.dataset.plan;localStorage.gymPlan=plan;routine()});document.querySelector('#prev').onclick=()=>{week--;show(document.querySelector('.view.active').id)};document.querySelector('#next').onclick=()=>{week++;show(document.querySelector('.view.active').id)};document.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([localStorage.gymV3||'{}'],{type:'application/json'}));a.download='gym-comunidad-copia.json';a.click()};document.querySelector('#import').onclick=()=>document.querySelector('#importFile').click();document.querySelector('#importFile').onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{JSON.parse(r.result);localStorage.gymV3=r.result;show('today');alert('Datos importados')}catch{alert('Archivo no válido')}};f&&r.readAsText(f)};document.querySelector('#reset').onclick=()=>{if(confirm('¿Borrar solo los datos de la semana visible?')){let x=get();delete x[key()];save(x);stats()}};show('today');
</script>
</body></html>
