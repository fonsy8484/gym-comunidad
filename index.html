<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Entrenamiento — PPL & Upper/Lower</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    :root {
      --bg: #0b0f14;
      --card: #121821;
      --text: #e6eef7;
      --muted: #9aa7b5;
      --accent: #3b82f6;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444;
      --border: #1f2937;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    a { color: var(--accent); text-decoration: none; }
    header {
      position: sticky; top: 0; z-index: 10;
      background: rgba(11,15,20,0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 {
      font-size: 18px; margin: 0; font-weight: 600;
    }
    .week-selector {
      display: flex; gap: 8px; align-items: center;
      font-size: 13px; color: var(--muted);
    }
    .week-selector button {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 4px 8px; border-radius: 6px;
    }
    nav.bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(11,15,20,0.95);
      border-top: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      padding: 8px;
    }
    nav.bottom-nav button {
      background: transparent; border: none; color: var(--muted);
      font-size: 12px; padding: 6px; border-radius: 8px;
    }
    nav.bottom-nav button.active {
      background: var(--card); color: var(--text);
    }
    main {
      padding: 16px;
      padding-bottom: 80px;
    }
    .section { display: none; }
    .section.active { display: block; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .card h2, .card h3 {
      margin: 0 0 8px 0; font-size: 16px; font-weight: 600;
    }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .week-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      gap: 6px; margin-bottom: 12px;
    }
    .day-circle {
      aspect-ratio: 1; border-radius: 50%;
      background: var(--bg); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--muted);
    }
    .day-circle.completed {
      background: var(--green); color: #fff; border-color: var(--green);
    }
    .day-circle.today {
      box-shadow: 0 0 0 2px var(--accent);
    }
    .progress-bar {
      height: 8px; background: var(--bg);
      border-radius: 999px; overflow: hidden;
      margin: 8px 0;
    }
    .progress-bar .fill {
      height: 100%; background: var(--green);
      width: 0%; transition: width 0.25s ease;
    }
    .btn {
      background: var(--accent); color: #fff;
      border: none; padding: 8px 12px;
      border-radius: 8px; font-size: 13px;
    }
    .btn.secondary {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.small {
      padding: 4px 8px; font-size: 12px;
    }
    .exercise {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      background: #0f141c;
    }
    .exercise-header {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 10px;
    }
    .muscle-thumb {
      width: 64px; height: 64px; border-radius: 8px;
      background: #0b0f14; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: var(--muted);
      overflow: hidden;
    }
    .muscle-thumb img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .exercise-title {
      flex: 1;
    }
    .exercise-title h3 {
      margin: 0; font-size: 15px;
    }
    .exercise-title p {
      margin: 2px 0 0 0; font-size: 12px;
    }
    .sets {
      display: grid; gap: 8px;
    }
    .set-row {
      display: grid;
      grid-template-columns: 32px 1fr 1fr 60px 40px;
      gap: 6px; align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
    }
    .set-label {
      font-size: 12px; color: var(--muted);
      text-align: center;
    }
    .set-row input {
      background: #0b0f14; border: 1px solid var(--border);
      color: var(--text); border-radius: 6px;
      padding: 6px; font-size: 13px;
      width: 100%;
    }
    .set-row .check {
      width: 28px; height: 28px;
      border-radius: 6px; border: 1px solid var(--border);
      background: #0b0f14; color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .set-row .check.done {
      background: var(--green); border-color: var(--green);
    }
    .timer {
      display: flex; gap: 8px; align-items: center;
      margin-top: 8px;
    }
    .timer .time {
      font-variant-numeric: tabular-nums;
      font-size: 14px; color: var(--muted);
    }
    .note-area {
      width: 100%; background: #0b0f14;
      border: 1px solid var(--border);
      color: var(--text); border-radius: 8px;
      padding: 6px; font-size: 12px;
      margin-top: 8px;
    }
    .alt-btn {
      margin-top: 8px;
      font-size: 12px; color: var(--muted);
      background: transparent; border: none;
      padding: 0;
    }
    .alt-panel {
      display: none; margin-top: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px; color: var(--muted);
    }
    .summary-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .summary-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .summary-item .value {
      font-size: 18px; font-weight: 700;
    }
    .summary-item .label {
      font-size: 11px; color: var(--muted);
      margin-top: 4px;
    }
    .muscle-list {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 6px; margin-top: 8px;
    }
    .muscle-row {
      display: flex; justify-content: space-between;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
    }
    .export-area {
      margin-top: 12px;
      display: grid; gap: 8px;
    }
    .export-area button {
      background: var(--card); color: var(--text);
      border: 1px solid var(--border);
      padding: 8px; border-radius: 8px;
      font-size: 13px;
    }
    .recommendation {
      margin-top: 8px;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.3);
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      color: #bfdbfe;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1 id="headerTitle">Hoy</h1>
    <div class="week-selector">
      <button id="prevWeek">◀</button>
      <span id="weekLabel">Semana</span>
      <button id="nextWeek">▶</button>
    </div>
  </header>

  <main>
    <!-- SECCION: HOY -->
    <section id="section-hoy" class="section active">
      <div class="card">
        <h2 id="todayTitle">Cargando día...</h2>
        <p id="todayDesc">Selecciona una rutina abajo</p>
        <div class="week-grid" id="weekGrid"></div>
        <div class="progress-bar"><div class="fill" id="todayProgress"></div></div>
        <p id="todayProgressText" style="font-size:12px;color:var(--muted);margin:4px 0 0 0;">0 series completadas</p>
      </div>

      <div id="todayExercises"></div>

      <div class="card">
        <h3>Descanso</h3>
        <div class="timer">
          <button class="btn small" id="startTimer90">90 s</button>
          <button class="btn small" id="startTimer120">120 s</button>
          <span class="time" id="timerDisplay">00:00</span>
          <button class="btn small secondary" id="resetTimer">Reiniciar</button>
        </div>
      </div>
    </section>

    <!-- SECCION: RUTINA -->
    <section id="section-rutina" class="section">
      <div class="card">
        <h2>Rutinas</h2>
        <p>Elige un plan y un día para ver o entrenar.</p>
        <div style="display:grid;gap:8px;margin-top:8px;">
          <button class="btn" data-plan="PPL" data-day="0">PPL — Lunes: Push A</button>
          <button class="btn" data-plan="PPL" data-day="1">PPL — Martes: Pull A</button>
          <button class="btn" data-plan="PPL" data-day="2">PPL — Miernes: Legs A</button>
          <button class="btn" data-plan="PPL" data-day="3">PPL — Jueves: Push B</button>
          <button class="btn" data-plan="PPL" data-day="4">PPL — Viernes: Pull B</button>
          <button class="btn" data-plan="PPL" data-day="5">PPL — Sábado: Legs B</button>
          <button class="btn secondary" data-plan="UL" data-day="0">Upper/Lower — Lunes: Upper A</button>
          <button class="btn secondary" data-plan="UL" data-day="1">Upper/Lower — Martes: Lower A</button>
          <button class="btn secondary" data-plan="UL" data-day="2">Upper/Lower — Miernes: Upper B</button>
          <button class="btn secondary" data-plan="UL" data-day="3">Upper/Lower — Jueves: Lower B</button>
          <button class="btn secondary" data-plan="UL" data-day="4">Upper/Lower — Viernes: Upper C</button>
          <button class="btn secondary" data-plan="UL" data-day="5">Upper/Lower — Sábado: Lower C</button>
        </div>
      </div>

      <div id="routineDetail"></div>
    </section>

    <!-- SECCION: PROGRESO -->
    <section id="section-progreso" class="section">
      <div class="card">
        <h2>Resumen de la semana</h2>
        <div class="summary-grid">
          <div class="summary-item">
            <div class="value" id="sumDays">0 / 6</div>
            <div class="label">Dias completado
